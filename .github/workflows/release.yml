name: Build desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the installers under (e.g. v0.1.0). Leave empty to only upload workflow artifacts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: "desktop/release/*.dmg"
          - os: windows-latest
            artifact: "desktop/release/*.exe"
          - os: ubuntu-latest
            artifact: "desktop/release/*.AppImage"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx electron-builder --publish never

      # Proves the macOS build carries a valid (ad-hoc) signature. An app with a broken or
      # missing signature is what makes macOS report "the app is damaged", so this must fail
      # the build rather than ship a DMG nobody can open.
      - name: Verify macOS code signature
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then echo "No .app bundle was produced"; exit 1; fi
          for app in "${apps[@]}"; do
            echo "::group::$app"
            codesign -dv --verbose=4 "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: notion-oracle-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Notion Oracle ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: ${{ matrix.artifact }}
