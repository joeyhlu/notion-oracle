appId: com.notionoracle.desktop
productName: Notion Oracle
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
asarUnpack:
  - dist/mcp/**
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  # Signing is done by scripts/afterPack.cjs, which ad-hoc signs the bundle with codesign.
  # electron-builder's `identity` only searches the keychain, so no value it accepts means
  # "ad-hoc" - "-" makes it hunt for a certificate named "-", find none, and skip signing,
  # leaving a bundle macOS reports as damaged. null stops it trying; the hook does the work.
  identity: null
  # Hardened runtime only pays off with notarization, and combined with an ad-hoc signature
  # it is a known cause of launch crashes.
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # macOS refuses Apple Events and calendar access unless the app declares why it wants them;
  # without these strings the permission prompt never appears and the request is denied outright.
  extendInfo:
    NSAppleEventsUsageDescription: Notion Oracle sends Apple Events to the Calendar app to read and create your events, and to the Notion apps to see which page you are on.
    NSCalendarsUsageDescription: Notion Oracle reads and creates events in your calendar when you ask it to.
    NSCalendarsFullAccessUsageDescription: Notion Oracle reads, creates, changes and deletes events in your calendar when you ask it to.
    NSSystemAdministrationUsageDescription: Notion Oracle uses automation to control the Notion Calendar app when the system calendar is unavailable.
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  category: Utility
  target: [AppImage]
afterPack: scripts/afterPack.cjs
publish: null
