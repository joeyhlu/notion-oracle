# Keeps the two packages and the workflows current without anyone remembering to.
#
# Electron is the one that matters: only the newest three majors get Chromium security fixes,
# and the app renders text the model wrote. Minor and patch bumps are grouped into one pull
# request per package per week so the log is readable; a major arrives on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
