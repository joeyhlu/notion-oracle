name: Build desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the installers under (e.g. v0.1.0). Leave empty to only upload workflow artifacts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: "desktop/release/*.dmg"
          - os: windows-latest
            artifact: "desktop/release/*.exe"
          - os: ubuntu-latest
            artifact: "desktop/release/*.AppImage"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Signed when the repository has the certificates, ad-hoc when it does not. Add these
      # repository secrets to switch the macOS build to Developer ID + notarization:
      #   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      # and these for Authenticode on the Windows installer:
      #   WIN_CERT_P12_BASE64, WIN_CERT_PASSWORD
      # Nothing else changes; an empty secret leaves the unsigned path exactly as it was.
      - name: Build installers
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CERT_P12_BASE64: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "$MAC_CERT_P12_BASE64" ]; then
            echo "Signing with Developer ID and notarizing"
            CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD" \
              npx electron-builder --config electron-builder.signed.yml --publish never
          elif [ "${{ matrix.os }}" = "windows-latest" ] && [ -n "$WIN_CERT_P12_BASE64" ]; then
            echo "Signing the Windows installer"
            CSC_LINK="$WIN_CERT_P12_BASE64" CSC_KEY_PASSWORD="$WIN_CERT_PASSWORD" \
              npx electron-builder --publish never
          else
            npx electron-builder --publish never
          fi

      # Proves the macOS build carries a valid signature, ad-hoc or Developer ID. An app with a
      # broken or missing signature is what makes macOS report "the app is damaged", so this must
      # fail the build rather than ship a DMG nobody can open.
      - name: Verify macOS code signature
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then echo "No .app bundle was produced"; exit 1; fi
          for app in "${apps[@]}"; do
            echo "::group::$app"
            codesign -dv --verbose=4 "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: notion-oracle-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Notion Oracle ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: ${{ matrix.artifact }}

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: node scripts/e2e.mjs
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: notion-oracle-extension
          path: extension/release/*.zip
          if-no-files-found: error
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Notion Oracle ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: extension/release/*.zip
