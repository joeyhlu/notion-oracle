name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run check

      # Loads the built extension into Chromium against a mock Notion page and scripted APIs:
      # setup, the AI menu, chat, web search, mentions, undo, history and both themes.
      - run: npx playwright install --with-deps chromium
      - run: node scripts/e2e.mjs --out screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-screenshots
          path: extension/screenshots
          if-no-files-found: warn
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check

      # Renders the panel in a real browser. The unit tests read the stylesheet and cannot see
      # that the page *looks* right: 0.3.0 shipped with all three views drawn on top of each
      # other and every test green.
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs --out screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-screenshots
          path: desktop/screenshots
          if-no-files-found: warn
